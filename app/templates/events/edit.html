{% extends "base.html" %}

{% block title %}Edit event | Simcha Planner{% endblock %}

{% block content %}
  <section class="section" aria-labelledby="edit-event-heading">
    <div class="container">
      <h1 id="edit-event-heading">Edit event</h1>
      {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
      {% endif %}
      <form class="event-form" method="post" action="{{ url_for('events.update_event', event_id=event_id) }}">
        {% include "events/_fields.html" %}

        <button class="button" type="submit">Save changes</button>
        <a href="{{ url_for('events.show_event', event_id=event_id) }}">Cancel</a>
      </form>
    </div>
  </section>
{% endblock %}
